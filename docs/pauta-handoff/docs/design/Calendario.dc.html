<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pauta: Calendário editorial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B23B8}a:hover{color:#6B4EFF}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #6B4EFF;outline-offset:2px}
</style>
</helmet>
<div style="font-family: Figtree, system-ui, sans-serif; color: #1D2433; background: #F4F5F7; min-height: 1000px; display: flex; flex-wrap: wrap; align-items: stretch">

<nav aria-label="Navegação principal" style="flex: 1 1 248px; max-width: 280px; min-width: 232px; background: #FFFFFF; border-right: 1px solid #E3E6EC; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #E3E6EC; border-radius: 14px">
    <span style="width: 32px; height: 32px; border-radius: 10px; background: #6B4EFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px">P</span>
    <span style="font-weight: 700; font-size: 14px">Estúdio Bia Social</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <a href="Main.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 12px; color: #1D2433; font-size: 14px; text-decoration: none">Em pauta hoje</a>
    <a href="Calendario.dc.html" aria-current="page" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 12px; background: #EEEAFF; color: #3B23B8; font-weight: 700; font-size: 14px; text-decoration: none">Calendário</a>
    <a href="Producao.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 12px; color: #1D2433; font-size: 14px; text-decoration: none">Produção</a>
    <a href="Aprovacao.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 12px; color: #1D2433; font-size: 14px; text-decoration: none">Aprovações</a>
    <a href="#financeiro" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 12px; color: #1D2433; font-size: 14px; text-decoration: none">Financeiro</a>
  </div>
  <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
    <legend style="font-size: 12px; font-weight: 600; color: #5E6675; padding: 0 12px 6px">Mostrar clientes</legend>
    <label style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #F28C28">Padaria Pão Quente</label>
    <label style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #1C8C86">Clínica Sorrir</label>
    <label style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #D9468F">Studio Lume</label>
    <label style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #3D6FE0">Forma Academia</label>
    <label style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #7A4FD6">Vino &amp; Companhia</label>
  </fieldset>
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 12px; font-size: 13px; color: #3E4656">
    <span style="font-size: 12px; font-weight: 600; color: #5E6675">Status</span>
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 4px; border: 2px dashed #8A93A3; box-sizing: border-box"></span>Planejado</span>
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #FFE9D6; border: 2px solid #C2410C; box-sizing: border-box"></span>Em aprovação ou ajuste</span>
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #8A93A3"></span>Aprovado e agendado</span>
    <span style="display: flex; align-items: center; gap: 8px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="3" aria-hidden="true"><path d="M4 12l5 5 11-11"></path></svg>Publicado</span>
  </div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 40px 40px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
    <button aria-label="Mês anterior" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E3E6EC; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2433" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.02em">Novembro 2026</h1>
    <button aria-label="Próximo mês" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E3E6EC; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2433" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    <span style="font-size: 14px; color: #5E6675">58 posts em 5 clientes</span>
    <div style="margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap">
      <div role="group" aria-label="Visualização" style="display: flex; background: #FFFFFF; border: 1px solid #E3E6EC; border-radius: 999px; padding: 3px">
        <button aria-pressed="true" style="height: 36px; padding: 0 16px; border-radius: 999px; border: none; background: #1D2433; color: #FFFFFF; font-weight: 700; font-size: 13px">Mês</button>
        <button aria-pressed="false" style="height: 36px; padding: 0 16px; border-radius: 999px; border: none; background: transparent; color: #1D2433; font-size: 13px">Semana</button>
        <button aria-pressed="false" style="height: 36px; padding: 0 16px; border-radius: 999px; border: none; background: transparent; color: #1D2433; font-size: 13px">Lista</button>
      </div>
      <button style="height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: #6B4EFF; color: #FFFFFF; font-weight: 700; font-size: 14px">Planejar dezembro</button>
    </div>
  </div>

  <div style="overflow-x: auto; background: #FFFFFF; border-radius: 24px; padding: 12px">
    <div style="min-width: 900px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7">
        <span style="font-size: 13px; font-weight: 600; color: #5E6675; padding: 6px 10px">{{ w }}</span>
      </sc-for>
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
        <div style="min-height: 132px; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 5px; background: {{ d.bg }}; outline: {{ d.ring }}; outline-offset: -2px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px; color: {{ d.numColor }}; padding: 0 2px">{{ d.n }}</span>
          <sc-for list="{{ d.posts }}" as="p" hint-placeholder-count="2">
            <span style="display: flex; align-items: center; gap: 6px; border-radius: 8px; padding: 4px 6px; font-size: 12px; font-weight: 600; line-height: 1.2; background: {{ p.bg }}; color: {{ p.fg }}; border: {{ p.border }}">
              <span style="width: 8px; height: 8px; border-radius: 3px; flex: none; background: {{ p.dot }}"></span>
              <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ p.t }}</span>
              <sc-if value="{{ p.done }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="3" aria-label="Publicado"><path d="M4 12l5 5 11-11"></path></svg></sc-if>
            </span>
          </sc-for>
          <sc-if value="{{ d.more }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5E6675; padding: 0 4px">{{ d.moreLabel }}</span></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const C = {
      pq: { dot: '#F28C28', bg: '#FFF1E6' },
      cs: { dot: '#1C8C86', bg: '#E2F4F2' },
      sl: { dot: '#D9468F', bg: '#FCE3F0' },
      fa: { dot: '#3D6FE0', bg: '#E4ECFC' },
      vc: { dot: '#7A4FD6', bg: '#EFE8FB' }
    };
    const post = (c, t, s) => {
      const k = C[c];
      if (s === 'plan') return { t, dot: k.dot, bg: '#FFFFFF', fg: '#3E4656', border: '1.5px dashed #B8BFCC', done: false };
      if (s === 'appr') return { t, dot: k.dot, bg: '#FFE9D6', fg: '#8A3A06', border: '1.5px solid #C2410C', done: false };
      if (s === 'done') return { t, dot: k.dot, bg: k.bg, fg: '#1D2433', border: '1.5px solid transparent', done: true };
      return { t, dot: k.dot, bg: k.bg, fg: '#1D2433', border: '1.5px solid transparent', done: false };
    };
    const data = {
      2: [post('pq', 'Pão do dia', 'done'), post('fa', 'Treino de pernas', 'done')],
      3: [post('cs', 'Mitos do clareamento', 'done'), post('sl', 'Antes e depois', 'done')],
      4: [post('pq', 'Sonho de creme', 'done'), post('vc', 'Harmonização', 'done')],
      5: [post('fa', 'Aula experimental', 'done'), post('cs', 'Equipe da clínica', 'done')],
      6: [post('pq', 'Bastidores da fornada', 'done'), post('cs', 'Dica de escovação', 'done'), post('sl', 'Agenda de dezembro', 'sched'), post('fa', 'Desafio 30 dias', 'sched'), post('vc', 'Rótulo da semana', 'sched')],
      7: [post('sl', 'Depoimento Carla', 'sched')],
      9: [post('pq', 'Fermentação natural', 'appr'), post('fa', 'Planos de fim de ano', 'sched')],
      10: [post('cs', 'Antes e depois', 'appr'), post('vc', 'Queijos e vinhos', 'sched')],
      11: [post('pq', 'Panetone artesanal', 'appr'), post('sl', 'Cuidados pós-limpeza', 'sched')],
      12: [post('fa', 'Personal em dupla', 'sched'), post('cs', 'Clareamento caseiro?', 'appr')],
      13: [post('pq', 'Encomendas de Natal', 'appr'), post('vc', 'Happy hour', 'plan')],
      14: [post('sl', 'Kit presente', 'plan')],
      16: [post('pq', 'Rosca de Natal', 'plan'), post('fa', 'Black Friday', 'plan')],
      17: [post('cs', 'Sorriso de festa', 'plan'), post('vc', 'Espumantes', 'plan')],
      18: [post('pq', 'Equipe da padaria', 'plan'), post('sl', 'Black Friday', 'plan')],
      19: [post('fa', 'Black Friday', 'plan')],
      20: [post('cs', 'Black Friday', 'plan'), post('pq', 'Black Friday', 'plan'), post('vc', 'Black Friday', 'plan')],
      23: [post('pq', 'Pedidos até dia 20', 'plan')],
      24: [post('sl', 'Vale-presente', 'plan'), post('cs', 'Agenda de dezembro', 'plan')],
      25: [post('fa', 'Treino nas férias', 'plan')],
      26: [post('pq', 'Chocotone', 'plan'), post('vc', 'Ceia harmonizada', 'plan')],
      27: [post('cs', 'Depoimento', 'plan')],
      30: [post('pq', 'Retrospectiva', 'plan'), post('sl', 'Retrospectiva', 'plan')]
    };
    const days = [];
    for (let n = 1; n <= 35; n++) {
      const inMonth = n <= 30;
      const all = data[n] || [];
      const posts = all.slice(0, 3);
      const today = n === 6;
      days.push({
        n: inMonth ? String(n) : String(n - 30),
        posts: inMonth ? posts : [],
        more: inMonth && all.length > 3,
        moreLabel: '+' + (all.length - 3) + ' posts',
        bg: !inMonth ? '#F8F9FB' : (today ? '#FFF6D6' : '#F4F5F7'),
        ring: today ? '2px solid #E0A800' : 'none',
        numColor: !inMonth ? '#A0A7B4' : (today ? '#6B4A00' : '#1D2433')
      });
    }
    return { weekdays: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'], days };
  }
}
</script>
</body>
</html>
